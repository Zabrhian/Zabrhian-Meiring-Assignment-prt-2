<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Tkayys Photography</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">

            <a class="brand" href="index.html">Tkayys Photography</a>

            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="enquiry.html">Enquiry</a>
                <a href="contactus.html">Contact Us</a>
            </nav>

        </div>
    </header>

    <main>

        <h2>Make an Enquiry</h2>

        <p>
            Interested in booking a photography session?
            Complete the form below and tell us about your requirements.
        </p>

        <form>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <label for="service">Photography Service:</label>
            <select id="service" name="service">
                <option value="">Select a service</option>
                <option value="portrait">Portrait Photography</option>
                <option value="event">Event Photography</option>
                <option value="creative">Creative Photography</option>
            </select>

            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date">

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Submit Enquiry</button>

        </form>

    </main>

    </div>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 Tkayys Photography. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
