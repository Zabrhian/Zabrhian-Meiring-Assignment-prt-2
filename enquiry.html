<body>
    <header>
    <h1>Tkayys Photography</h1>
    <p>Capturing Moments, creating memories.</p>

    <nav>
        <a href="index.html">Home</a>

    <main>
        <h2>Make an Enquiry</h2>

        <p>
            Interested in Booking a photography session?
            Complete the form below and tell us abour your requirements.
        </p> 

        <form>
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name">

            <br><br>

            <label for="email">Email Adress:</label>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">

            <br><br>

            <label for="service">Photography service</label>
            <select id="service" name="service"> 
                <option value="">select a service</option>
                <option value="portrait">Portrait Photography</option>
                <option value="event">Event Photography</option>
                <option value="Creative">Creative Photography</option>
                </select>

                <br><br>

                <label for="date">Preferred Date</label>
                <input type="date" name="date"

                <br><br>

                <label for="message">Message:</label>
                <br>
                <textterea id="message" name="message" rows="5" cols="40"></textterea>

                <br><br>

                <button type="submit">Submit Enquiry</button>

        </form>

    </main>
